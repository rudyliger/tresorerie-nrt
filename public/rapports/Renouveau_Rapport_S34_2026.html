<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport Semaine S34 — 17→22 Août 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --off:   #f7f6f3;
  --light: #eeece8;
  --border:#d8d5ce;
  --muted: #9a9690;
  --mid:   #6b6760;
  --ink:   #1a1917;
  --blue:  #1a3a8f;

  --up-bg:   #eef6f0; --up-bord: #b6dcc2; --up-txt: #1a5c35;
  --dn-bg:   #fdf0ef; --dn-bord: #f2c0bb; --dn-txt: #9b2318;
  --neu-bg:  #f2f2f2; --neu-bord:#d0d0d0; --neu-txt:#555;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--off); font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button { cursor: pointer; font-family: inherit; }

/* ══ LOGIN ══ */
#login {
  min-height: 100svh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: var(--white);
}
.login-wrap { width: 100%; max-width: 320px; text-align: center; padding: 40px 24px; }
.login-logo {
  font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 8px;
}
.login-week {
  font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 0.05em; color: var(--blue); margin-bottom: 6px;
}
.login-period { font-size: 12px; color: var(--muted); font-weight: 300; margin-bottom: 48px; }
.pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
.pin-dot {
  width: 46px; height: 46px; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 500; color: var(--ink); background: var(--white);
  transition: all .15s;
}
.pin-dot.filled { border-color: var(--ink); background: var(--ink); color: var(--white); }
.pin-dot.error  { border-color: var(--dn-txt); background: var(--dn-bg); color: var(--dn-txt); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 220px; margin: 0 auto 14px; }
.num-btn {
  height: 50px; border: 1.5px solid var(--border); background: var(--white);
  color: var(--ink); font-size: 17px; font-weight: 400;
  display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.num-btn:hover { background: var(--off); border-color: var(--ink); }
.num-btn:active { background: var(--ink); color: var(--white); }
.num-btn.del { font-size: 12px; color: var(--muted); }
.num-btn.zero { grid-column: 2; }
.login-err { font-size: 11px; color: var(--dn-txt); letter-spacing: 0.05em; height: 18px; font-weight: 500; }

/* ══ APP ══ */
#app { display: none; }

/* TOPBAR */
.topbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 40px; display: flex; align-items: center; justify-content: space-between;
  height: 52px; position: sticky; top: 0; z-index: 100;
}
.topbar-brand { font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; }
.topbar-week { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 600; color: var(--blue); letter-spacing: 0.1em; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.access-pill { font-size: 10px; padding: 3px 10px; border: 1px solid var(--border); color: var(--mid); background: var(--off); }
.logout-btn { font-size: 11px; padding: 4px 12px; border: 1px solid var(--border); background: var(--white); color: var(--mid); transition: all .12s; }
.logout-btn:hover { border-color: var(--ink); color: var(--ink); }

/* TABS */
.tabs-strip {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 40px; display: flex; overflow-x: auto;
}
.tab-btn {
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
  padding: 13px 20px; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); white-space: nowrap; transition: all .15s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

/* MAIN */
.main { padding: 36px 40px; max-width: 1280px; margin: 0 auto; }

/* PANEL */
.shop-panel { display: none; }
.shop-panel.active { display: block; animation: fadeUp .2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* SHOP HEADER */
.shop-hd {
  margin-bottom: 28px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.shop-title { font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.shop-title span { color: var(--blue); }
.shop-date { font-size: 12px; color: var(--muted); font-weight: 300; margin-top: 4px; }

/* SECTION LABEL */
.sec-label {
  font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 12px; margin-top: 32px;
}
.sec-label:first-of-type { margin-top: 0; }

/* KPI BIG */
.kpi-big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
.kpi-card-big { padding: 22px 20px; border: 1.5px solid var(--border); background: var(--white); }
.kpi-card-big.up   { background: var(--up-bg); border-color: var(--up-bord); }
.kpi-card-big.down { background: var(--dn-bg); border-color: var(--dn-bord); }
.kpi-big-label { font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.kpi-big-val { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
.kpi-card-big.up   .kpi-big-val { color: var(--up-txt); }
.kpi-card-big.down .kpi-big-val { color: var(--dn-txt); }
.kpi-big-n1 { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi-big-n1-val { font-size: 11px; color: var(--muted); font-weight: 300; }
.evol-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; }
.evol-badge.up   { background: var(--up-bg); color: var(--up-txt); border: 1px solid var(--up-bord); }
.evol-badge.down { background: var(--dn-bg); color: var(--dn-txt); border: 1px solid var(--dn-bord); }
.evol-badge.neu  { background: var(--neu-bg); color: var(--neu-txt); border: 1px solid var(--neu-bord); }

/* KPI SMALL */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 8px; }
.kpi-card-sm { padding: 14px 16px 12px; border: 1px solid var(--border); background: var(--white); }
.kpi-card-sm.up   { background: var(--up-bg); border-color: var(--up-bord); }
.kpi-card-sm.down { background: var(--dn-bg); border-color: var(--dn-bord); }
.kpi-sm-label { font-family: 'Unbounded', sans-serif; font-size: 7px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.kpi-sm-val { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.kpi-card-sm.up   .kpi-sm-val { color: var(--up-txt); }
.kpi-card-sm.down .kpi-sm-val { color: var(--dn-txt); }
.kpi-sm-n1 { margin-top: 6px; display: flex; align-items: center; gap: 5px; }
.kpi-sm-n1-val { font-size: 10px; color: var(--muted); font-weight: 300; }

/* COMPARISON TABLE */
.cmp-table { border: 1px solid var(--border); background: var(--white); overflow: hidden; overflow-x: auto; margin-bottom: 14px; }
.tbl-row {
  display: grid;
  grid-template-columns: 120px 110px 90px 72px 110px 80px 60px 70px 90px 60px 80px;
  border-bottom: 1px solid var(--light);
  min-width: 944px;
}
.tbl-row:last-child { border-bottom: none; }
.tbl-row:hover:not(.tbl-head):not(.tbl-row-total) { background: var(--off); }
.tbl-head {
  background: var(--ink); border-bottom: none;
}
.tbl-head .tbl-cell {
  font-family: 'Unbounded', sans-serif; font-size: 7px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.6); padding: 10px 12px;
}
.tbl-head .tbl-name { color: rgba(255,255,255,0.4); }
.tbl-cell { padding: 12px 12px; display: flex; flex-direction: column; justify-content: center; }
.tbl-name { border-right: 1px solid var(--light); }
.tbl-num  { text-align: right; align-items: flex-end; }
.tbl-main { font-size: 13px; font-weight: 500; color: var(--ink); }
.tbl-sub  { font-size: 10px; color: var(--muted); font-weight: 300; margin-top: 2px; }
.tbl-shop-name { font-size: 13px; font-weight: 500; }
.tbl-pct-badge {
  font-family: 'Unbounded', sans-serif; font-size: 7px; font-weight: 600;
  background: var(--off); border: 1px solid var(--border);
  padding: 2px 5px; margin-top: 4px; color: var(--muted); align-self: flex-start;
}
.tbl-row-total {
  background: var(--off);
  border-top: 2px solid var(--border);
}
.tbl-row-total .tbl-main { font-family: 'Unbounded', sans-serif; font-size: 12px; font-weight: 600; }
.tbl-row-total .tbl-shop-name { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
.tbl-row-web { background: #f8f7ff; }
.tbl-row-web .tbl-shop-name { color: var(--blue); }

@media(max-width:680px){
  .cmp-table { font-size: 11px; }
  .tbl-row { grid-template-columns: 90px 90px 60px 90px 65px 50px 55px 70px 50px 65px; min-width: 680px; }
  .tbl-cell { padding: 9px 8px; }
  .tbl-main { font-size: 11px; }
}
.daily-chart-block { border: 1px solid var(--border); background: var(--white); overflow: hidden; margin-bottom: 0; }
.daily-chart-hd { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.daily-chart-title { font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.daily-legend { display: flex; gap: 14px; }
.daily-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-dot.cur { background: var(--ink); }
.legend-dot.n1  { background: var(--border); }
.daily-chart-area { padding: 20px 18px 16px; }
.day-bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; height: 130px; }
.day-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
.day-bar-group { width: 100%; display: flex; gap: 3px; align-items: flex-end; justify-content: center; }
.bar { border-radius: 1px 1px 0 0; transition: opacity .2s; width: 12px; }
.bar.cur { background: var(--ink); }
.bar.n1  { background: var(--light); }
.day-label { font-size: 9px; color: var(--muted); font-weight: 400; text-align: center; }
.day-val   { font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 600; color: var(--ink); text-align: center; white-space: nowrap; }

/* TOP RANKS */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rank-block { border: 1px solid var(--border); background: var(--white); overflow: hidden; }
.rank-hd { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--off); }
.rank-hd-title { font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; }
.rank-hd-sub   { font-size: 10px; color: var(--muted); font-weight: 300; }
.rank-row {
  display: grid; grid-template-columns: 26px 1fr 48px 76px;
  padding: 10px 16px; border-bottom: 1px solid var(--light); align-items: center; gap: 8px;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: var(--off); }
.rank-num { font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 300; color: var(--muted); text-align: center; }
.rank-num.n1 { font-weight: 600; color: var(--ink); }
.rank-name { font-size: 12px; font-weight: 400; }
.rank-bar-bg { height: 2px; background: var(--light); margin-top: 5px; overflow: hidden; }
.rank-bar-fill { height: 100%; background: var(--ink); transition: width .6s ease; }
.rank-pcs { font-size: 10px; color: var(--muted); text-align: right; font-weight: 300; }
.rank-ca  { font-size: 12px; font-weight: 500; text-align: right; }
.rank-n1-row {
  display: grid; grid-template-columns: 26px 1fr 48px 76px;
  padding: 4px 16px 8px; border-bottom: 1px solid var(--light); gap: 8px;
}
.rank-n1-row:last-child { border-bottom: none; }
.rank-n1-label { font-size: 9px; color: var(--muted); font-weight: 300; font-style: italic; }
.rank-n1-pcs   { font-size: 9px; color: var(--muted); text-align: right; }
.rank-n1-ca    { font-size: 10px; color: var(--muted); text-align: right; font-weight: 300; }
.rank-n1-evol  { font-size: 10px; font-weight: 600; margin-left: 4px; }
.rank-n1-evol.up { color: var(--up-txt); }
.rank-n1-evol.dn { color: var(--dn-txt); }

/* TOTAL SHOP ROWS */
.total-block { border: 1px solid var(--border); background: var(--white); overflow: hidden; margin-bottom: 14px; }
.total-hd { padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--off); font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.total-shop-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--light); }
.total-shop-row:last-child { border-bottom: none; }
.total-shop-name { font-size: 13px; font-weight: 500; }
.total-shop-meta { font-size: 11px; color: var(--muted); font-weight: 300; margin-top: 2px; }
.total-shop-right { text-align: right; }
.total-shop-ca { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 600; }
.total-shop-evol { font-size: 11px; font-weight: 600; margin-top: 3px; }
.total-shop-evol.up { color: var(--up-txt); }
.total-shop-evol.dn { color: var(--dn-txt); }

/* FOOTER */
.footer { border-top: 1px solid var(--border); background: var(--white); padding: 14px 40px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 300; }

/* RESPONSIVE */
@media(max-width:860px){ .two-col{grid-template-columns:1fr;} }
@media(max-width:680px){
  .topbar { padding: 0 16px; height: 46px; }
  .topbar-week { font-size: 9px; }
  .access-pill { display: none; }
  .tabs-strip { padding: 0 8px; }
  .tab-btn { font-size: 11px; padding: 11px 12px; }
  .main { padding: 20px 16px; }
  .shop-hd { flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 20px; }
  .shop-title { font-size: 19px; }
  .kpi-big { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card-big { padding: 14px 12px; }
  .kpi-big-val { font-size: 20px; }
  .kpi-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .two-col { gap: 12px; }
  .day-bars { height: 90px; }
  .bar { width: 9px; }
  .footer { padding: 12px 16px; flex-direction: column; gap: 4px; font-size: 10px; }
}

/* KPI grids by count */
.kpi-3 { grid-template-columns: repeat(3, 1fr); }
.kpi-4 { grid-template-columns: repeat(4, 1fr); }

/* N-1 value text */
.kpi-n1-val { font-size: 11px; color: var(--muted); font-weight: 300; }

/* STOCK BAR */
.stock-bar {
  border: 1px solid var(--border); background: var(--off);
  padding: 14px 20px; display: flex; align-items: center; gap: 20px;
}
.stock-label {
  font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap;
}
.stock-val {
  font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600; color: var(--ink);
}
.stock-note { font-size: 11px; color: var(--muted); font-weight: 300; }

/* DAY CA + IDV labels */
.day-evol { font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 700; text-align: center; }
.day-ca   { font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 600; color: var(--ink); text-align: center; white-space: nowrap; }
.day-idv  { font-size: 8px; color: var(--mid); text-align: center; white-space: nowrap; }

/* Weight badge */
.wgt-badge {
  font-family: 'Unbounded', sans-serif; font-size: 7px; font-weight: 600;
  background: var(--off); border: 1px solid var(--border);
  padding: 2px 5px; margin-left: 5px; color: var(--muted);
}

/* TOTAL stock line */
.total-shop-stock { font-size: 11px; color: var(--muted); margin-top: 3px; }
.total-shop-stock strong { color: var(--ink); }

/* DAILY chart height — taller to fit IDV */
.day-bars { height: 155px !important; }

@media(max-width:680px){
  .kpi-3, .kpi-4 { grid-template-columns: 1fr 1fr !important; }
  .day-bars { height: 120px !important; }
}


/* Brand per-shop pills */
.brand-shops { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.bs-pill {
  font-size:9px; font-weight:500; padding:2px 7px;
  border-radius:2px; white-space:nowrap;
}
.bs-orl { background:#e8f0fe; color:#1a3a8f; border:1px solid #c5d4f5; }
.bs-bou { background:#fef3e2; color:#7a4500; border:1px solid #f5d9a0; }
.bs-tou { background:#e9f5e9; color:#1a5c35; border:1px solid #b6dcc2; }
</style>
</head>

function fmtK(n){ return typeof n==='number'?n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0}):String(n); }
function fmtEur(n){ return fmtK(n)+' €'; }
function eDir(v){ return v>=0?'up':'down'; }
function ePct(cur,ref){ return ref?((cur/ref-1)*100):null; }
function badge(pct){
  if(pct===null) return '';
  const d=eDir(pct), s=pct>=0?'+':'';
  return `<span class="evol-badge ${d}">${s}${pct.toFixed(1)}%</span>`;
}
function n1v(val){ const s=String(val); if(s==='0'||s==='0 €'||s==='0.00'||s==='0.00 €') return `<span class="kpi-n1-val">N-1 : n/d</span>`; return `<span class="kpi-n1-val">N-1 : ${val}</span>`; }

let pin='';
function digit(n){ if(pin.length>=4)return; pin+=String(n); updateDots(); if(pin.length===4)checkPin(); }
function del(){ pin=pin.slice(0,-1); updateDots(); document.getElementById('login-err').textContent=''; }
function updateDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('d'+i);
    d.className='pin-dot'+(pin.length>i?' filled':'');
    d.textContent=pin.length>i?'·':'';
  }
}
function checkPin(){
  const access=ACCESS[pin];
  if(!access){
    for(let i=0;i<4;i++) document.getElementById('d'+i).className='pin-dot error';
    document.getElementById('login-err').textContent='Code incorrect';
    setTimeout(()=>{ pin=''; updateDots(); document.getElementById('login-err').textContent=''; },900);
    return;
  }
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('access-lbl').textContent=access.label;
  buildApp(access.shops);
}
function logout(){ location.reload(); }

function buildApp(shops){
  const tabs=document.getElementById('tabs');
  const panel=document.getElementById('main-panel');
  shops.forEach((id,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.textContent=SHOP_NAMES[id];
    btn.onclick=()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.shop-panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+id).classList.add('active');
      animateBars('panel-'+id);
    };
    tabs.appendChild(btn);
    const div=document.createElement('div');
    div.id='panel-'+id;
    div.className='shop-panel'+(i===0?' active':'');
    div.innerHTML=id==='total'?buildTotal():buildShop(id);
    panel.appendChild(div);
  });
  animateBars('panel-'+shops[0]);
}
function animateBars(pid){
  setTimeout(()=>{ document.querySelectorAll('#'+pid+' .rank-bar-fill').forEach(el=>{ el.style.width=el.dataset.pct+'%'; }); },60);
}

function buildDailyChart(d){
  const maxVal=Math.max(...d.daily_ca,...d.daily_ca_n1,1);
  const bars=d.daily_ca.map((ca,i)=>{
    const n1=d.daily_ca_n1[i];
    const hC=Math.round((ca/maxVal)*100);
    const hN=Math.round((n1/maxVal)*100);
    const ev=n1>0&&ca>0?((ca/n1-1)*100).toFixed(0):null;
    const idv=d.daily_idv?d.daily_idv[i]:null;
    const idvN=d.daily_idv_n1?d.daily_idv_n1[i]:null;
    const col=ev!==null?(parseFloat(ev)>=0?'var(--up-txt)':'var(--dn-txt)'):'var(--muted)';
    return `<div class="day-col">
      <div class="day-evol" style="color:${col}">${ev!==null?(parseFloat(ev)>=0?'+':'')+ev+'%':'—'}</div>
      <div class="day-bar-group">
        <div class="bar cur" style="height:${hC}px;min-height:${ca>0?2:0}px"></div>
        <div class="bar n1"  style="height:${hN}px;min-height:${n1>0?2:0}px"></div>
      </div>
      <div class="day-label">${DAYS_LABELS[i]}</div>
      <div class="day-ca">${ca>0?fmtK(Math.round(ca))+' €':'<span style="color:var(--muted)">F</span>'}</div>
      ${idv&&idv>0?`<div class="day-idv">IDV ${idv.toFixed(2)}${idvN&&idvN>0?` <span style="color:${idv>=idvN?'var(--up-txt)':'var(--dn-txt)'};font-size:7px">${idv>=idvN?'↑':'↓'}${idvN.toFixed(2)}</span>`:''}</div>`:`<div class="day-idv" style="color:var(--muted)">—</div>`}
    </div>`;
  }).join('');
  return `<div class="daily-chart-block">
    <div class="daily-chart-hd">
      <span class="daily-chart-title">CA & IDV journaliers</span>
      <div class="daily-legend">
        <div class="daily-legend-item"><div class="legend-dot cur"></div><span>S34 2026</span></div>
        <div class="daily-legend-item"><div class="legend-dot n1"></div><span>S.A. 2025</span></div>
      </div>
    </div>
    <div class="daily-chart-area"><div class="day-bars" style="grid-template-columns:repeat(${d.daily_ca.length},1fr)">${bars}</div></div>
  </div>`;
}

      marg:prof/(ca/1.2)*100,marg_n1:prof_n1/(ca_n1/1.2)*100,
      idv:pcs/ord,idv_n1:pcs_n1/ord_n1,panier:ca/ord,panier_n1:ca_n1/ord_n1};

  const tableRows=[...SL,null].map(s=>{
    const isTot=s===null;

    const stk=s&&STOCK[s.id]?STOCK[s.id]:null;
    const obj_v=!isTot&&s.isShop&&OBJ[s.id]?OBJ[s.id]:(isTot?totalObj:0);
    const ca_r=isTot?T3.ca:s.ca, ca_n1_r=isTot?T3.ca_n1:s.ca_n1;
    const ev_ca_r=ePct(ca_r,ca_n1_r), ev_obj_r=obj_v>0?ePct(ca_r,obj_v):null;
    const marg_r=isTot?T3.marg:s.margin_pct, marg_n1_r=isTot?T3.marg_n1:s.margin_n1;
    const prof_r=isTot?T3.prof:s.profit;
    const ord_r=isTot?T3.ord:s.orders, ord_n1_r=isTot?T3.ord_n1:s.orders_n1;
    const pcs_r=isTot?T3.pcs:s.pcs, pcs_n1_r=isTot?T3.pcs_n1:s.pcs_n1;
    const pan_r=ca_r/ord_r, pan_n1_r=ca_n1_r/ord_n1_r;
    const idv_r=pcs_r/ord_r, idv_n1_r=pcs_n1_r/ord_n1_r;
    const pct_ca=(ca_r/tCa*100).toFixed(1);
    const stkTv=stk?stk.val:SL.filter(x=>STOCK[x.id]).reduce((a,r)=>a+STOCK[r.id].val,0);
    const stkTu=stk?stk.units:SL.filter(x=>STOCK[x.id]).reduce((a,r)=>a+STOCK[r.id].units,0);
    const stkN1v=stk?stk.val_n1:SL.filter(x=>STOCK[x.id]).reduce((a,r)=>a+STOCK[r.id].val_n1,0);
    const stkEv=((stkTv/stkN1v-1)*100).toFixed(1);
    const stkHtml=`<div class="tbl-main">${stkTv.toLocaleString('fr-FR')} €</div>
      <div class="tbl-sub">${stkTu.toLocaleString('fr-FR')} u.</div>
      <div class="tbl-sub" style="color:${stkTv<stkN1v?'var(--dn-txt)':'var(--up-txt)'}">${stkTv>=stkN1v?'+':''}${stkEv}% vs N-1</div>`;
    const rowCls=isTot?'tbl-row tbl-row-total':'tbl-row';
    return `<div class="${rowCls}">
      <div class="tbl-cell tbl-name"><span class="tbl-shop-name">${name}</span>${!isTot?`<span class="tbl-pct-badge">${pct_ca}%</span>`:''}</div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${fmtEur(ca_r)}</div><div class="tbl-sub">${n1v(fmtEur(ca_n1_r))}</div></div>
      <div class="tbl-cell tbl-num">${obj_v>0?`<div class="tbl-main">${fmtEur(obj_v)}</div><div class="tbl-sub"><span class="evol-badge ${ev_obj_r>=0?'up':'dn'}" style="font-size:9px;padding:1px 5px">${ev_obj_r>=0?'+':''}${ev_obj_r.toFixed(1)}%</span></div>`:'<div class="tbl-main" style="color:var(--muted)">—</div>'}</div>
      <div class="tbl-cell tbl-num">${ev_ca_r===null?'<span class="evol-badge" style="opacity:.5">n/d</span>':`<span class="evol-badge ${ev_ca_r>=0?'up':'dn'}">${ev_ca_r>=0?'+':''}${ev_ca_r.toFixed(1)}%</span>`}</div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${fmtEur(Math.round(prof_r))}</div></div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${marg_r.toFixed(1)}%</div><div class="tbl-sub">${n1v(isFinite(marg_n1_r)&&marg_n1_r>0?marg_n1_r.toFixed(1)+'%':'n/d')}</div></div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${ord_r}</div><div class="tbl-sub">${n1v(ord_n1_r)}</div></div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${pcs_r}</div><div class="tbl-sub">${n1v(pcs_n1_r)}</div></div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${pan_r.toFixed(0)} €</div><div class="tbl-sub">${n1v(isFinite(pan_n1_r)&&pan_n1_r>0?pan_n1_r.toFixed(0)+' €':'n/d')}</div></div>
      <div class="tbl-cell tbl-num"><div class="tbl-main">${idv_r.toFixed(2)}</div><div class="tbl-sub">${n1v(isFinite(idv_n1_r)&&idv_n1_r>0?idv_n1_r.toFixed(2):'n/d')}</div></div>
      <div class="tbl-cell tbl-num">${stkHtml}</div>
    </div>`;
  }).join('');
  const tableHead=`<div class="tbl-row tbl-head">
    <div class="tbl-cell tbl-name">Boutique</div><div class="tbl-cell tbl-num">CA TTC</div>
    <div class="tbl-cell tbl-num">Objectif</div><div class="tbl-cell tbl-num">vs N-1</div>
    <div class="tbl-cell tbl-num">Marge</div><div class="tbl-cell tbl-num">Taux</div>
    <div class="tbl-cell tbl-num">Cmd.</div><div class="tbl-cell tbl-num">Articles</div>
    <div class="tbl-cell tbl-num">Panier</div><div class="tbl-cell tbl-num">IDV</div>
    <div class="tbl-cell tbl-num">Stock</div>
  </div>`;
  const dtCA=[0,1,2,3,4,5].map(i=>SL.reduce((s,r)=>s+(D[r.id].daily_ca[i]||0),0));
  const dtN1=[0,1,2,3,4,5].map(i=>SL.reduce((s,r)=>s+(D[r.id].daily_ca_n1[i]||0),0));
  return `
  <div class="shop-hd">
    <div><div class="shop-title">Total <span>Tous canaux</span></div>
    <div class="shop-date">S34 · Lun 17 → Sam 22 Août 2026</div></div>
  </div>
  <div class="sec-label">Ligne 1 · Performance commerciale — 3 boutiques</div>
  <div class="kpi-big kpi-4">
    <div class="kpi-card-big ${eDir(evCA)}">
      <div class="kpi-big-label">CA TTC</div>
      <div class="kpi-big-val">${fmtEur(Math.round(T3.ca))}</div>
      <div class="kpi-big-n1">${badge(evCA)} ${n1v(fmtEur(Math.round(T3.ca_n1)))}</div>
    </div>
    <div class="kpi-card-big ${eDir(evObj)}">
      <div class="kpi-big-label">Objectif semaine</div>
      <div class="kpi-big-val">${fmtEur(totalObj)}</div>
      <div class="kpi-big-n1">${badge(evObj)} <span class="kpi-n1-val">Écart : ${evObj>=0?'+':''}${fmtK(Math.round(T3.ca-totalObj))} €</span></div>
    </div>
    <div class="kpi-card-big ${eDir(evPr)}">
      <div class="kpi-big-label">Marge brute</div>
      <div class="kpi-big-val">${fmtEur(Math.round(T3.prof))}</div>
      <div class="kpi-big-n1">${badge(evPr)} ${n1v(fmtEur(Math.round(T3.prof_n1)))}</div>
    </div>
    <div class="kpi-card-big ${evMarg>=0?'up':'down'}">
      <div class="kpi-big-label">Taux de marge</div>
      <div class="kpi-big-val">${T3.marg.toFixed(1)}%</div>
      <div class="kpi-big-n1">
        <span class="evol-badge ${evMarg>=0?'up':'down'}">${evMarg>=0?'+':''}${evMarg.toFixed(1)} pt</span>
        ${n1v(T3.marg_n1.toFixed(1)+'%')}
      </div>
    </div>
  </div>
  <div class="sec-label" style="margin-top:10px">Ligne 2 · Activité</div>
  <div class="kpi-big kpi-4">
    <div class="kpi-card-big ${eDir(evOrd)}">
      <div class="kpi-big-label">Commandes</div>
      <div class="kpi-big-val">${T3.ord}</div>
      <div class="kpi-big-n1">${badge(evOrd)} ${n1v(T3.ord_n1)}</div>
    </div>
    <div class="kpi-card-big ${eDir(evPcs)}">
      <div class="kpi-big-label">Articles vendus</div>
      <div class="kpi-big-val">${T3.pcs}</div>
      <div class="kpi-big-n1">${badge(evPcs)} ${n1v(T3.pcs_n1)}</div>
    </div>
    <div class="kpi-card-big ${eDir(evPan)}">
      <div class="kpi-big-label">Panier moyen</div>
      <div class="kpi-big-val">${T3.panier.toFixed(0)} €</div>
      <div class="kpi-big-n1">${badge(evPan)} ${n1v(T3.panier_n1.toFixed(0)+' €')}</div>
    </div>
    <div class="kpi-card-big ${eDir(evIDV)}">
      <div class="kpi-big-label">Indice de vente</div>
      <div class="kpi-big-val">${T3.idv.toFixed(2)}</div>
      <div class="kpi-big-n1">${badge(evIDV)} ${n1v(T3.idv_n1.toFixed(2))}</div>
    </div>
  </div>
  <div class="sec-label">Tableau comparatif par canal</div>
  <div class="cmp-table">${tableHead}${tableRows}</div>
  <div class="sec-label">Top 10 Marques · Catégories · 3 boutiques</div>
  ${buildTotalRanks()}
  ${buildBBTop20()}
  <div class="sec-label">CA journalier consolidé vs N-1</div>
  ${buildDailyChart({daily_ca:dtCA,daily_ca_n1:dtN1,daily_idv:null,daily_idv_n1:null})}`;
}



// Auto-déverrouillage si chargé depuis le hub (#code=XXXX)
function __autoUnlock(){
  var h = window.location.hash || '';
  var m = h.match(/code=(\d{4})/);
  if(m && typeof ACCESS !== 'undefined' && ACCESS[m[1]]){
    pin = m[1];
    checkPin();
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', __autoUnlock);
} else {
  __autoUnlock();
}

</script>
</body>
</html>
