<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renouveau · Rapports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#1a1917; --off:#f7f6f3; --white:#fff; --border:#d8d5ce;
  --light:#eeece8; --muted:#9a9690; --blue:#1a3a8f; --blue-bg:#eef1fa;
}
html, body { height: 100%; background: var(--off); font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#login { position: fixed; inset: 0; z-index: 100; background: var(--off); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.login-wrap { width: 100%; max-width: 320px; text-align: center; padding: 40px 24px; }
.login-logo { font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.login-title { font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; color: var(--blue); letter-spacing: -0.02em; margin-bottom: 6px; }
.login-sub { font-size: 12px; color: var(--muted); margin-bottom: 32px; }
.pin-dots { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; }
.pin-dot { width: 54px; height: 60px; border: 1px solid var(--border); border-radius: 3px; background: var(--white); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--ink); transition: border-color .15s, background .15s; }
.pin-dot.filled { border-color: var(--blue); background: var(--blue-bg); }
.pin-dot.error { border-color: #c0392b; background: #fdf0ee; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pin-key { height: 64px; border: 1px solid var(--border); border-radius: 3px; background: var(--white); font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 400; color: var(--ink); cursor: pointer; transition: background .12s; }
.pin-key:hover { background: var(--light); }
.pin-key:active { background: var(--border); }
.pin-key.fn { font-size: 16px; color: var(--muted); }
.login-err { color: #c0392b; font-size: 12px; height: 16px; margin-top: 16px; }
#app { display: none; height: 100vh; }
.layout { display: flex; height: 100vh; }
.sidebar { width: 280px; flex-shrink: 0; background: var(--ink); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.sb-head { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sb-brand { font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.sb-title { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600; margin-top: 6px; letter-spacing: -0.02em; }
.sb-title span { color: #6f8fd8; }
.sb-section { padding: 16px 16px 4px; }
.sb-section-label { font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 400; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 0 8px 10px; }
/* GROUPE DEROULANT */
.sb-group { margin-bottom: 4px; }
.sb-group-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-radius: 4px; cursor: pointer; transition: background .12s; }
.sb-group-head:hover { background: rgba(255,255,255,0.06); }
.sb-group-title { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
.sb-chevron { font-size: 10px; color: rgba(255,255,255,0.4); transition: transform .2s; }
.sb-group.open .sb-chevron { transform: rotate(90deg); }
.sb-group-body { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
.sb-group.open .sb-group-body { max-height: 600px; }
.sb-item { display: block; padding: 10px 14px 10px 26px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; transition: background .12s; color: inherit; }
.sb-item:hover { background: rgba(255,255,255,0.06); }
.sb-item.active { background: rgba(111,143,216,0.18); }
.sb-item.active .sb-item-title { color: #9fb6e8; }
.sb-item-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.sb-item-period { font-size: 11px; color: rgba(255,255,255,0.45); font-weight: 300; margin-top: 2px; }
.sb-foot { margin-top: auto; padding: 18px 24px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 300; display: flex; justify-content: space-between; align-items: center; }
.sb-logout { color: rgba(255,255,255,0.5); cursor: pointer; font-size: 11px; }
.sb-logout:hover { color: #fff; }
.main { flex: 1; height: 100vh; overflow: hidden; position: relative; }
.report-frame { width: 100%; height: 100%; border: none; background: var(--off); }
.mobile-bar { display: none; background: var(--ink); color: #fff; padding: 14px 18px; align-items: center; gap: 14px; }
.mobile-bar-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 600; }
.burger { background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; }
@media(max-width: 820px){
  .sidebar { position: fixed; left: 0; top: 0; z-index: 50; transform: translateX(-100%); transition: transform .25s; box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
  .sidebar.open { transform: translateX(0); }
  .mobile-bar { display: flex; }
  .main { height: calc(100vh - 50px); }
  .layout { flex-direction: column; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
  .overlay.show { display: block; }
}
</style>
</head>
<body>
<div id="login">
  <div class="login-wrap">
    <div class="login-logo">NRT Associes SAS</div>
    <div class="login-title">Renouveau</div>
    <div class="login-sub">Rapports de performance &middot; Acces protege</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="digit(1)">1</button>
      <button class="pin-key" onclick="digit(2)">2</button>
      <button class="pin-key" onclick="digit(3)">3</button>
      <button class="pin-key" onclick="digit(4)">4</button>
      <button class="pin-key" onclick="digit(5)">5</button>
      <button class="pin-key" onclick="digit(6)">6</button>
      <button class="pin-key" onclick="digit(7)">7</button>
      <button class="pin-key" onclick="digit(8)">8</button>
      <button class="pin-key" onclick="digit(9)">9</button>
      <button class="pin-key fn" onclick="del()">&#9003;</button>
      <button class="pin-key" onclick="digit(0)">0</button>
      <span></span>
    </div>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <div class="layout">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-brand">NRT Associes SAS</div>
        <div class="sb-title">Renouveau <span>&middot;</span> Rapports</div>
      </div>
      <div class="sb-section">
        <div class="sb-section-label">Hebdomadaires</div>
        <div id="weekly-groups"></div>
      </div>
      <div class="sb-section">
        <div class="sb-section-label">Mensuels</div>
        <div id="monthly-list"></div>
      </div>
      <div class="sb-foot">
        <span>Usage interne</span>
        <span class="sb-logout" onclick="logout()">Deconnexion</span>
      </div>
    </aside>
    <div class="main">
      <div class="mobile-bar">
        <button class="burger" onclick="openSidebar()">&#9776;</button>
        <span class="mobile-bar-title" id="mobile-title">Renouveau</span>
      </div>
      <iframe class="report-frame" id="report-frame" src=""></iframe>
    </div>
  </div>
</div>
<script>
// Chaque rapport : file, title, period, month (pour le regroupement), order (tri, plus grand = plus recent)
var REPORTS = {
  weekly: [
    { file:'Renouveau_Rapport_S35_2026.html', title:'Semaine 35', period:'du 24 au 29 août', month:'Août 2026', order:35 },
    { file:'Renouveau_Rapport_S34_2026.html', title:'Semaine 34', period:'du 17 au 22 août', month:'Août 2026', order:34 },
    { file:'Renouveau_Rapport_S33_2026.html', title:'Semaine 33', period:'du 10 au 15 août', month:'Août 2026', order:33 },
    { file:'Renouveau_Rapport_S32_2026.html', title:'Semaine 32', period:'du 3 au 8 août', month:'Août 2026', order:32 },
    { file:'Renouveau_Rapport_S31_2026.html', title:'Semaine 31', period:'du 27 juillet au 2 août', month:'Août 2026', order:31 },
    { file:'Renouveau_Rapport_S30_2026.html', title:'Semaine 30', period:'du 20 au 25 juillet', month:'Juillet 2026', order:30 },
    { file:'Renouveau_Rapport_S29_2026.html', title:'Semaine 29', period:'du 13 au 18 juillet', month:'Juillet 2026', order:29 },
    { file:'Renouveau_Rapport_S28_2026.html', title:'Semaine 28', period:'du 6 au 11 juillet', month:'Juillet 2026', order:28 },
    { file:'Renouveau_Rapport_S27_2026.html', title:'Semaine 27', period:'du 29 juin au 4 juillet', month:'Juillet 2026', order:27 },
    { file:'Renouveau_Rapport_S26_2026.html', title:'Semaine 26', period:'du 22 au 27 juin', month:'Juin 2026', order:26 },
    { file:'Renouveau_Rapport_S25_2026.html', title:'Semaine 25', period:'du 15 au 21 juin', month:'Juin 2026', order:25 },
    { file:'Renouveau_Rapport_S24_2026.html', title:'Semaine 24', period:'du 8 au 14 juin', month:'Juin 2026', order:24 },
    { file:'Renouveau_Rapport_S23_2026.html', title:'Semaine 23', period:'du 1 au 7 juin',  month:'Juin 2026', order:23 },
    { file:'Renouveau_Rapport_S22_2026.html', title:'Semaine 22', period:'du 25 au 31 mai', month:'Mai 2026',  order:22 },
    { file:'Renouveau_Rapport_S21_2026.html', title:'Semaine 21', period:'du 18 au 24 mai', month:'Mai 2026',  order:21 },
    { file:'Renouveau_Rapport_S20_2026.html', title:'Semaine 20', period:'du 11 au 17 mai', month:'Mai 2026',  order:20 },
  ],
  monthly: [
    { file:'Renouveau_Rapport_Aout2026.html', title:'Août 2026', period:'du 1 au 31 août' },
    { file:'Renouveau_Rapport_Juillet2026.html', title:'Juillet 2026', period:'du 1 au 31 juillet' },
    { file:'Renouveau_Rapport_Juin2026.html', title:'Juin 2026', period:'du 1 au 30 juin' },
    { file:'Renouveau_Rapport_Mai2026.html', title:'Mai 2026', period:'du 1 au 31 mai' },
    { file:'Renouveau_Rapport_Avril2026.html', title:'Avril 2026', period:'du 1 au 30 avril' },
  ],
};
var VALID_CODES = ['4501','9937','1827','2201'];
var pin = '';
function digit(n){ if(pin.length>=4) return; pin+=String(n); updateDots(); if(pin.length===4) checkPin(); }
function del(){ pin=pin.slice(0,-1); updateDots(); document.getElementById('login-err').textContent=''; }
function updateDots(){
  for(var i=0;i<4;i++){
    var d=document.getElementById('d'+i);
    d.className='pin-dot'+(pin.length>i?' filled':'');
    d.textContent=pin.length>i?'\u00b7':'';
  }
}
function checkPin(){
  if(VALID_CODES.indexOf(pin)===-1){
    for(var i=0;i<4;i++) document.getElementById('d'+i).className='pin-dot error';
    document.getElementById('login-err').textContent='Code incorrect';
    setTimeout(function(){ pin=''; updateDots(); document.getElementById('login-err').textContent=''; },900);
    return;
  }
  window.__accessCode = pin;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  buildMenu();
  // Ouvre automatiquement la semaine la plus recente
  var latest = REPORTS.weekly.slice().sort(function(a,b){ return b.order-a.order; })[0];
  loadReport(latest);
}
function logout(){ location.reload(); }

function buildMenu(){
  var wg=document.getElementById('weekly-groups');
  wg.innerHTML='';
  // Regroupe les semaines par mois, en conservant l'ordre d'apparition
  var months=[]; var byMonth={};
  REPORTS.weekly.forEach(function(r){
    if(!byMonth[r.month]){ byMonth[r.month]=[]; months.push(r.month); }
    byMonth[r.month].push(r);
  });
  months.forEach(function(m, idx){
    var group=document.createElement('div');
    group.className='sb-group'+(idx===0?' open':''); // 1er mois ouvert par defaut
    var head=document.createElement('div');
    head.className='sb-group-head';
    head.innerHTML='<span class="sb-group-title">'+m+'</span><span class="sb-chevron">&#9654;</span>';
    head.onclick=function(){ group.classList.toggle('open'); };
    var body=document.createElement('div');
    body.className='sb-group-body';
    byMonth[m].forEach(function(r){ body.appendChild(makeItem(r)); });
    group.appendChild(head); group.appendChild(body);
    wg.appendChild(group);
  });
  var ml=document.getElementById('monthly-list');
  ml.innerHTML='';
  REPORTS.monthly.forEach(function(r){ ml.appendChild(makeItem(r)); });
}
function makeItem(r){
  var div=document.createElement('div');
  div.className='sb-item';
  div.dataset.file=r.file;
  div.innerHTML='<div class="sb-item-title">'+r.title+'</div><div class="sb-item-period">'+r.period+'</div>';
  div.onclick=function(){ loadReport(r); closeSidebar(); };
  return div;
}
function loadReport(r){
  var items=document.querySelectorAll('.sb-item');
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle('active', items[i].dataset.file===r.file);
  }
  // chemin relatif: le hub est servi a la racine, les rapports dans /rapports/
  document.getElementById('report-frame').src = r.file+'#code='+(window.__accessCode||'');
  document.getElementById('mobile-title').textContent = r.title;
  // ouvre le groupe du mois selectionne
  var items2=document.querySelectorAll('.sb-group');
  // (laisse l'utilisateur gerer l'ouverture/fermeture)
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
</script>
</body>
</html>
