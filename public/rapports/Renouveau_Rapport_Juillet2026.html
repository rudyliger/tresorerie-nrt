<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport Mensuel — Juillet 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --off:   #f7f6f3;
  --light: #eeece8;
  --border:#d8d5ce;
  --muted: #9a9690;
  --ink:   #1a1916;
  --mid:   #5a5750;
  --blue:  #1a56db;
  --up-bg:   #eaf7ef;
  --up-bord: #b6e5c8;
  --up-txt:  #1a6638;
  --dn-bg:   #fdf0ef;
  --dn-bord: #f2c0bb;
  --dn-txt:  #9b2318;
  --neu-bg:  #f2f1ed;
  --neu-bord:#d8d5ce;
  --neu-txt: #5a5750;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--off);
  color: var(--ink);
  min-height: 100vh;
}

/* ══════════════════════════════
   LOGIN
══════════════════════════════ */
#login-screen {
  position: fixed; inset: 0;
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.login-inner {
  width: 340px;
  text-align: center;
}
.login-wordmark {
  font-family: 'Unbounded', sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 56px;
}
.login-head {
  font-family: 'Unbounded', sans-serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 4px;
}
.login-sub {
  font-size: 13px;
  color: var(--muted);
  font-weight: 300;
  margin-bottom: 40px;
}
.pin-dots {
  display: flex; gap: 10px; justify-content: center;
  margin-bottom: 32px;
}
.pin-dot {
  width: 48px; height: 48px;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  transition: all 0.15s;
  background: var(--white);
}
.pin-dot.filled { border-color: var(--ink); background: var(--ink); color: var(--white); }
.pin-dot.error  { border-color: var(--dn-txt); background: var(--dn-bg); color: var(--dn-txt); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.numpad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  max-width: 240px; margin: 0 auto 16px;
}
.num-btn {
  height: 52px; border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink);
  font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 400;
  cursor: pointer; transition: all .12s;
  display: flex; align-items: center; justify-content: center;
}
.num-btn:hover { background: var(--off); border-color: var(--ink); }
.num-btn:active { background: var(--ink); color: var(--white); }
.num-btn.del { font-size: 12px; font-weight: 500; color: var(--muted); }
.num-btn.zero { grid-column: 2; }
.login-err {
  font-size: 11px; color: var(--dn-txt);
  letter-spacing: 0.05em; height: 18px;
  font-weight: 500;
}

/* ══════════════════════════════
   APP
══════════════════════════════ */
#app { display: none; }

/* ── TOPBAR ── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-brand {
  font-family: 'Unbounded', sans-serif;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--ink);
}
.topbar-period {
  font-size: 12px; color: var(--muted); font-weight: 300;
  letter-spacing: 0.05em;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.access-pill {
  font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
  padding: 4px 12px; border: 1px solid var(--border);
  color: var(--mid); background: var(--off);
}
.logout-btn {
  font-size: 11px; font-weight: 400; letter-spacing: 0.05em;
  padding: 4px 12px; border: 1px solid var(--border);
  background: var(--white); color: var(--mid);
  cursor: pointer; transition: all .12s;
}
.logout-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── TABS ── */
.tabs-strip {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  display: flex; gap: 0; overflow-x: auto;
}
.tab-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.04em;
  padding: 14px 20px;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

/* ── MAIN ── */
.main { padding: 40px; max-width: 1280px; margin: 0 auto; }

/* ── PANEL ── */
.shop-panel { display: none; }
.shop-panel.active { display: block; animation: fadeUp .2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ── SHOP HEADER ── */
.shop-hd {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.shop-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 26px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--ink);
}
.shop-title span { color: var(--blue); }
.shop-date { font-size: 12px; color: var(--muted); font-weight: 300; }

/* ── SECTION LABEL ── */
.sec-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 400;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px; margin-top: 36px;
}
.sec-label:first-child { margin-top: 0; }

/* ── ALERTS ── */
.alerts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.alert {
  font-size: 11.5px; font-weight: 400;
  padding: 6px 12px; border-left: 3px solid;
}
.alert.down { background: var(--dn-bg); border-color: var(--dn-txt); color: var(--dn-txt); }
.alert.up   { background: var(--up-bg); border-color: var(--up-txt); color: var(--up-txt); }
.alert.warn { background: #fefbe8; border-color: #b45309; color: #78350f; }

/* ══════════════════════════════
   KPI CARDS — BIG 3
══════════════════════════════ */
.kpi-big {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 16px;
}
.kpi-card-big {
  padding: 24px 22px;
  border: 1.5px solid var(--border);
  background: var(--white);
  position: relative;
  transition: border-color .15s;
}
.kpi-card-big.up   { background: var(--up-bg); border-color: var(--up-bord); }
.kpi-card-big.down { background: var(--dn-bg); border-color: var(--dn-bord); }
.kpi-card-big.neu  { background: var(--white); }

.kpi-big-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 8.5px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px;
}
.kpi-big-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 30px; font-weight: 600;
  letter-spacing: -0.03em; line-height: 1;
  color: var(--ink);
}
.kpi-card-big.up   .kpi-big-val { color: var(--up-txt); }
.kpi-card-big.down .kpi-big-val { color: var(--dn-txt); }
.kpi-big-unit { font-size: 15px; font-weight: 300; margin-left: 2px; }

.kpi-big-n1 {
  margin-top: 12px;
  display: flex; align-items: center; gap: 8px;
}
.kpi-big-n1-val { font-size: 12px; color: var(--muted); font-weight: 300; }
.evol-badge {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px;
}
.evol-badge.up   { background: var(--up-bg); color: var(--up-txt); border: 1px solid var(--up-bord); }
.evol-badge.down { background: var(--dn-bg); color: var(--dn-txt); border: 1px solid var(--dn-bord); }
.evol-badge.neu  { background: var(--neu-bg); color: var(--neu-txt); border: 1px solid var(--neu-bord); }

/* ══════════════════════════════
   KPI CARDS — SMALL ROW
══════════════════════════════ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 8px;
}
.kpi-card-sm {
  padding: 16px 16px 14px;
  border: 1px solid var(--border);
  background: var(--white);
}
.kpi-card-sm.up   { background: var(--up-bg); border-color: var(--up-bord); }
.kpi-card-sm.down { background: var(--dn-bg); border-color: var(--dn-bord); }

.kpi-sm-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 7.5px; font-weight: 400;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.kpi-sm-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 18px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--ink);
}
.kpi-card-sm.up   .kpi-sm-val { color: var(--up-txt); }
.kpi-card-sm.down .kpi-sm-val { color: var(--dn-txt); }
.kpi-sm-n1 {
  margin-top: 6px; display: flex; align-items: center; gap: 6px;
}
.kpi-sm-n1-val { font-size: 11px; color: var(--muted); font-weight: 300; }

/* ══════════════════════════════
   TOP 5
══════════════════════════════ */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:860px){ .two-col{grid-template-columns:1fr;} }

.rank-block {
  border: 1px solid var(--border);
  background: var(--white);
  overflow: hidden;
}
.rank-hd {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.rank-hd-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 9px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
}
.rank-hd-sub { font-size: 11px; color: var(--muted); font-weight: 300; }

.rank-row {
  display: grid; grid-template-columns: 28px 1fr 60px 88px;
  align-items: center; gap: 10px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--light);
  transition: background .1s;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: var(--off); }
.rank-num {
  font-family: 'Unbounded', sans-serif; font-size: 10px;
  font-weight: 300; color: var(--muted); text-align: center;
}
.rank-num.n1 { color: var(--ink); font-weight: 600; }
.rank-name { font-size: 12.5px; font-weight: 400; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-bar-wrap { }
.rank-bar-bg { height: 2px; background: var(--light); }
.rank-bar-fill { height: 2px; background: var(--ink); width: 0; transition: width .7s cubic-bezier(.25,.46,.45,.94); }
.rank-pcs { font-size: 11px; color: var(--muted); text-align: right; font-weight: 300; }
.rank-ca { font-size: 12px; font-weight: 500; color: var(--ink); text-align: right; }

/* N-1 comparison rows inside top5 */
.rank-n1-row {
  display: grid; grid-template-columns: 28px 1fr 60px 88px;
  align-items: center; gap: 10px;
  padding: 7px 18px 11px;
  border-bottom: 1px solid var(--light);
  background: var(--off);
}
.rank-n1-row:last-child { border-bottom: none; }
.rank-n1-label { font-size: 10px; color: var(--muted); font-weight: 300; font-style: italic; }
.rank-n1-pcs { font-size: 10px; color: var(--muted); text-align: right; }
.rank-n1-ca { font-size: 11px; color: var(--muted); text-align: right; font-weight: 300; }
.rank-n1-evol { font-size: 10px; font-weight: 600; }
.rank-n1-evol.up { color: var(--up-txt); }
.rank-n1-evol.dn { color: var(--dn-txt); }

/* ══════════════════════════════
   CARTES CADEAUX
══════════════════════════════ */
.gc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.gc-card {
  border: 1px solid var(--border); background: var(--white);
  padding: 20px;
}
.gc-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 7.5px; font-weight: 400; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.gc-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink);
}
.gc-note { font-size: 11px; color: var(--muted); font-weight: 300; margin-top: 6px; }

/* ══════════════════════════════
   HISTORY
══════════════════════════════ */
.hist-block {
  border: 1px solid var(--border); background: var(--white); overflow: hidden;
}
.hist-top {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.hist-title {
  font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
}
.htabs { display: flex; gap: 4px; flex-wrap: wrap; }
.htab {
  font-size: 11px; font-weight: 400; padding: 5px 12px;
  border: 1px solid var(--border); background: none;
  color: var(--muted); cursor: pointer; transition: all .12s;
}
.htab:hover { color: var(--ink); border-color: var(--ink); }
.htab.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

.hist-content { display: none; }
.hist-content.active { display: block; overflow-x: auto; }

table.htable { width: 100%; border-collapse: collapse; }
table.htable th {
  font-family: 'Unbounded', sans-serif;
  font-size: 7.5px; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--muted); padding: 10px 14px; text-align: right;
  border-bottom: 1px solid var(--border); background: var(--off);
  white-space: nowrap;
}
table.htable th:first-child { text-align: left; }
table.htable td {
  font-size: 12px; font-weight: 300; padding: 9px 14px; text-align: right;
  border-bottom: 1px solid var(--light); color: var(--ink);
  white-space: nowrap;
}
table.htable td:first-child { text-align: left; font-weight: 500; }
table.htable tr.y26 td { background: #f9f8f5; }
table.htable tr:last-child td { border-bottom: none; }
.ep  { color: var(--up-txt) !important; font-weight: 600; }
.en  { color: var(--dn-txt) !important; font-weight: 600; }
.em  { color: var(--muted) !important; }

/* ══════════════════════════════
   WEB NOTICE
══════════════════════════════ */
.web-notice {
  font-size: 12px; font-weight: 300; color: var(--blue);
  padding: 10px 16px; border: 1px solid #c3d8f8; background: #eef4fd;
  margin-bottom: 24px;
}

/* ══════════════════════════════
   TOTAL PANEL SPECIFICS
══════════════════════════════ */
.total-shops-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
}
.total-shop-card {
  border: 1px solid var(--border); background: var(--white); padding: 18px 16px;
}
.total-shop-name {
  font-family: 'Unbounded', sans-serif; font-size: 8.5px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.total-shop-ca {
  font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--ink);
}
.total-shop-evol {
  font-size: 11px; font-weight: 600; margin-top: 6px;
}
.total-shop-evol.up { color: var(--up-txt); }
.total-shop-evol.dn { color: var(--dn-txt); }

/* ── OBJECTIVE CARD ── */
.obj-card {
  border: 1.5px solid var(--border);
  background: var(--white);
  padding: 18px 22px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.obj-card-label {
  font-family: 'Unbounded', sans-serif;
  font-size: 8.5px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted);
}
.obj-card-val {
  font-family: 'Unbounded', sans-serif;
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.02em;
}
.obj-card-evol {
  font-family: 'Unbounded', sans-serif;
  font-size: 11px; font-weight: 600;
  padding: 5px 14px;
}
.obj-card.ok  { background: var(--up-bg); border-color: var(--up-bord); }
.obj-card.ok  .obj-card-val  { color: var(--up-txt); }
.obj-card.ok  .obj-card-evol { background: var(--up-bg); color: var(--up-txt); border: 1px solid var(--up-bord); }
.obj-card.miss { background: var(--dn-bg); border-color: var(--dn-bord); }
.obj-card.miss .obj-card-val  { color: var(--dn-txt); }
.obj-card.miss .obj-card-evol { background: var(--dn-bg); color: var(--dn-txt); border: 1px solid var(--dn-bord); }

/* ── RANK WRAP (2 columns side by side) ── */
.rank-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media(max-width:900px){ .rank-wrap{grid-template-columns:1fr;} }

/* ── OMC FOCUS BLOCK ── */
.omc-block { border: 1px solid var(--border); background: var(--white); overflow: hidden; margin-bottom: 16px; }
.omc-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--off);
}
.omc-title { font-family:'Unbounded',sans-serif; font-size:11px; font-weight:400; letter-spacing:0.1em; }
.omc-sub   { font-size:11px; color:var(--muted); font-weight:300; margin-top:3px; }
.omc-total-wrap { display:flex; align-items:center; gap:10px; }
.omc-total-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
.omc-total-val { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:600; }
.omc-col-hd {
  display:grid; grid-template-columns:1fr 80px 70px 100px 70px;
  padding:8px 20px; border-bottom:1px solid var(--border);
  font-size:10px; color:var(--muted); font-weight:300; letter-spacing:0.05em;
}
.omc-row {
  display:grid; grid-template-columns:1fr 80px 70px 100px 70px;
  padding:12px 20px; border-bottom:1px solid var(--light); align-items:center;
}
.omc-row:last-child { border-bottom:none; }
.omc-loc { font-size:13px; font-weight:500; }
.omc-pcs { font-size:12px; color:var(--muted); text-align:right; }
.omc-pct-badge {
  font-family:'Unbounded',sans-serif; font-size:9px; font-weight:600;
  background:var(--off); border:1px solid var(--border);
  padding:3px 7px; text-align:center; justify-self:end;
}
.omc-ca   { font-size:13px; font-weight:500; text-align:right; }
.omc-evol { font-size:11px; font-weight:600; text-align:right; }
.omc-evol.up { color:var(--up-txt); }
.omc-evol.dn { color:var(--dn-txt); }
.hours-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 8px; }
@media(max-width:900px){ .hours-grid{grid-template-columns:1fr;} }
.hours-shop-block { border: 1px solid var(--border); background: var(--white); overflow: hidden; }
.hours-shop-title {
  font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  color: var(--ink); background: var(--off);
}
.hours-person-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 16px; border-bottom: 1px solid var(--light);
}
.hours-person-row:last-child { border-bottom: none; }
.hours-name { font-size: 12px; font-weight: 400; color: var(--ink); }
.hours-name small { font-size: 10px; color: var(--muted); font-weight: 300; margin-left: 4px; }
.hours-val { font-family: 'Unbounded', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink); }
.hours-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; background: var(--ink);
}
.hours-total-label {
  font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 400;
  letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.6);

════════════════════════════ */
const CODES = {
  '4501': { label:'Orléans + Web', shops:['orleans','rnvweb'] },
  '9937': { label:'Tours',          shops:['tours'] },
  '1827': { label:'Bourges',        shops:['bourges'] },
  '2201': { label:'Accès complet',  shops:['total','orleans','bourges','tours','rnvweb','omcweb','focusomc'] },
};

let pin='', access=null;

function addD(d){
  if(pin.length>=4) return;
  pin+=d; paintDots();
  if(pin.length===4) setTimeout(checkPin,120);
}
function delD(){
  pin=pin.slice(0,-1); paintDots();
  document.getElementById('login-err').textContent='';
}
function paintDots(){
  for(let i=0;i<4;i++){
    const el=document.getElementById('d'+i);
    el.classList.remove('filled','error');
    el.textContent = i<pin.length ? pin[i] : '';
    if(i<pin.length) el.classList.add('filled');
  }
}
function checkPin(){
  if(CODES[pin]){
    access=CODES[pin];
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('access-lbl').textContent=access.label;
    buildApp(access.shops);
  } else {
    for(let i=0;i<4;i++) document.getElementById('d'+i).classList.replace('filled','error');
    document.getElementById('login-err').textContent='Code incorrect';
    setTimeout(()=>{ pin=''; paintDots(); document.getElementById('login-err').textContent=''; },900);
  }
}
function logout(){
  pin=''; access=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  paintDots();
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('login-screen').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') addD(e.key);
  if(e.key==='Backspace') delD();
});

const SHOP_NAMES = { total:'Total', orleans:'Orléans', bourges:'Bourges', tours:'Tours', rnvweb:'Rnv. Web', omcweb:'OMC Web', focusomc:'Focus OMC' };

function buildApp(shops){
  const nav = document.getElementById('tabs-nav');
  const main = document.getElementById('app-main');
  nav.innerHTML=''; main.innerHTML='';
  shops.forEach((id,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    btn.textContent=SHOP_NAMES[id];
    btn.onclick=()=>showShop(id,btn);
    nav.appendChild(btn);
    const panel=document.createElement('div');
    panel.className='shop-panel'+(i===0?' active':'');
    panel.id='panel-'+id;
    panel.innerHTML = id==='total' ? buildTotal() : id==='focusomc' ? buildFocusOMC() : buildShop(id);
    main.appendChild(panel);
  });
  setTimeout(animBars,150);
}

function showShop(id,btn){
  document.querySelectorAll('.shop-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
  setTimeout(animBars,100);
}

function showHist(shop,metric,btn){
  const block=btn.closest('.hist-block');
  block.querySelectorAll('.hist-content').forEach(c=>c.classList.remove('active'));
  block.querySelectorAll('.htab').forEach(b=>b.classList.remove('active'));
  const t=document.getElementById(shop+'-'+metric);
  if(t) t.classList.add('active');
  btn.classList.add('active');
}

function animBars(){
  document.querySelectorAll('.rank-bar-fill[data-pct]').forEach(el=>{
    el.style.width=el.dataset.pct+'%';
  });
}

  return `<div class="omc-block">
    <div class="omc-header">
      <div>
        <div class="omc-title">Onze Mètres Carrés · Juillet 2026</div>
        <div class="omc-sub">Shops + OMC Web</div>
      </div>
      <div class="omc-total-wrap">
        <div class="omc-total-label">Total</div>
        <div class="omc-total-val">${fmtEur(total26)}</div>
        <span class="evol-badge ${evolDir}">${evolSign}${evolTotal}%</span>
      </div>
    </div>
    <div class="omc-col-hd">
      <div></div><div style="text-align:right">Pcs</div>
      <div style="text-align:right">Poids</div>
      <div style="text-align:right">CA TTC</div>
      <div style="text-align:right">vs N-1</div>
    </div>
    ${rowsHtml}
  </div>`;
}

function buildTotalHist(){
  const tabs=['ca','mg'];
  const labels=['CA TTC','Marge HT'];
  const active=['active',''];

  const mkTabBtns = tabs.map((t,i)=>
    `<button class="htab${i===0?' active':''}" onclick="showHist('total','${t}',this)">${labels[i]}</button>`
  ).join('');

  const mkCa = ()=>{
    let rows='';
    TOTAL.hist.ca.forEach((r,i)=>{
      const cls=i===0?'y26':'';
      const evolHtml = r.evol==='—'
        ? `<td class="em">—</td>`
        : (()=>{
            const dir = TOTAL.hist.ca[0].cum >= TOTAL.hist.ca[1]?.cum ? 'p':'n';
            return `<td class="${dir==='p'?'ep':'en'}">${r.evol}</td>`;
          })();
      rows+=`<tr class="${cls}"><td>${r.yr}</td><td>${fmt(r.j)} €</td><td>${fmt(r.f)} €</td><td>${fmt(r.m)} €</td><td>${fmt(r.a)} €</td><td>${fmt(r.cum)} €</td>${evolHtml}</tr>`;
    });
    return `<table class="htable"><thead><tr><th>Année</th><th>Avril</th><th>Mai</th><th>Juin</th><th>Juillet</th><th>Cum. 4M</th><th>Évol. cum.</th></tr></thead><tbody>${rows}</tbody></table>`;
  };

  const mkMg = ()=>{
    let rows='';
    TOTAL.hist.mg.forEach((r,i)=>{
      const cls=i===0?'y26':'';
      rows+=`<tr class="${cls}"><td>${r.yr}</td><td>${fmt(r.j)} €</td><td>${fmt(r.f)} €</td><td>${fmt(r.m)} €</td><td>${fmt(r.a)} €</td><td>${fmt(r.cum)} €</td><td>${r.tx}</td></tr>`;
    });
    return `<table class="htable"><thead><tr><th>Année</th><th>Avril</th><th>Mai</th><th>Juin</th><th>Juillet</th><th>Cum. 4M</th><th>Taux marge</th></tr></thead><tbody>${rows}</tbody></table>`;
  };

  return `<div class="hist-block">
    <div class="hist-top">
      <span class="hist-title">Évolution des indicateurs</span>
      <div class="htabs">${mkTabBtns}</div>
    </div>
    <div class="hist-content active" id="total-ca">${mkCa()}</div>
    <div class="hist-content" id="total-mg">${mkMg()}</div>
  </div>`;
}

/* ════════════════════════════

function buildShop(id){
  const d = D[id];
  let html='';

  // Header
  html+=`<div class="shop-hd">
    <div>
      <div class="shop-title">${d.name} <span>${d.accent}</span></div>
      <div class="shop-date">Juillet 2026 · 01 → 30</div>
    </div>
  </div>`;

  // Web notice
  if(d.isWeb) html+=`<div class="web-notice">↗ ${d.webNote}</div>`;

  // Alerts
  html+=`<div class="alerts">`;
  d.alerts.forEach(a=>{ html+=`<div class="alert ${a.t}">${a.msg}</div>`; });
  html+=`</div>`;

  // Big 3 + Objectif : CA / Objectif / Taux marge / Marge brute
  html+=`<div class="sec-label">Indicateurs clés</div>
  <div class="kpi-big">`;

  // Build objective card HTML if applicable
  const caKpi = d.big.find(k=>k.obj);
  let objCardHtml = '';
  if(caKpi){
    const realVal = parseFloat(caKpi.val.replace(/[^\d]/g,''));
    const objVal  = parseFloat(caKpi.obj.replace(/[^\d]/g,''));
    const diff    = realVal - objVal;
    const pct     = ((realVal/objVal-1)*100).toFixed(1);
    const cls     = caKpi.objdir==='up' ? 'up' : 'down';
    const sign    = diff >= 0 ? '+' : '';
    objCardHtml = `<div class="kpi-card-big ${cls}">
      <div class="kpi-big-label">Objectif mensuel</div>
      <div class="kpi-big-val">${caKpi.obj.replace('Obj. : ','')}</div>
      <div class="kpi-big-n1">
        <span class="evol-badge ${cls}">${sign}${pct}%</span>
        <span class="kpi-big-n1-val">Écart : ${sign}${diff.toLocaleString('fr-FR')} €</span>
      </div>
    </div>`;
  }

  d.big.forEach((k, idx)=>{
    const dir = k.dir==='up'?'up': k.dir==='down'?'down':'neu';
    html+=`<div class="kpi-card-big ${dir}">
      <div class="kpi-big-label">${k.label}</div>
      <div class="kpi-big-val">${k.val}</div>
      <div class="kpi-big-n1">
        <span class="evol-badge ${dir}">${k.evol}</span>
        <span class="kpi-big-n1-val">${k.n1}</span>
      </div>
    </div>`;
    // Insert objective card right after CA (index 0)
    if(idx === 0 && objCardHtml) html += objCardHtml;
  });
  html+=`</div>`;

  // Small row
  html+=`<div class="kpi-row">`;
  d.small.forEach(k=>{
    const dir = k.dir==='up'?'up': k.dir==='down'?'down':'neu';
    html+=`<div class="kpi-card-sm ${dir}">
      <div class="kpi-sm-label">${k.label}</div>
      <div class="kpi-sm-val">${k.val}</div>
      <div class="kpi-sm-n1">
        <span class="evol-badge ${dir}">${k.evol}</span>
        <span class="kpi-sm-n1-val">${k.n1}</span>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // Top 5 (POS only)
  if(!d.isWeb){
    html+=`<div class="sec-label">Top 5 — Juillet 2026 vs N-1</div>
    <div class="two-col">
      ${buildRank(id+'-br', 'Marques', d.brands26, d.brands25)}
      ${buildRank(id+'-ca', 'Catégories', d.cats26, d.cats25)}
    </div>`;
  }

  // Gift cards
  html+=buildGC(id, d.gc);

  // History
  html+=buildHistory(id, d.hist, d.isWeb);

  return html;
}

function buildRank(cid, title, items26, items25){
  const max = items26[0].ca;
  const n1map = {};
  if(items25) items25.forEach(x=>{ n1map[x.n]=x; });

  let rows = items26.map((item,i)=>{
    const barPct = (item.ca/max*100).toFixed(1);
    const n1 = n1map[item.n];
    const evolCa = n1 ? ((item.ca/n1.ca-1)*100).toFixed(1) : null;
    const evolDir = evolCa!==null ? (parseFloat(evolCa)>=0?'up':'dn') : '';
    const evolStr = evolCa!==null ? (parseFloat(evolCa)>=0?'+':'')+evolCa+'%' : '—';
    // Weight % badge (only if pct field defined on item)
    const weightBadge = item.pct != null
      ? `<span style="font-family:'Unbounded',sans-serif;font-size:8px;font-weight:600;letter-spacing:0.05em;background:var(--off);border:1px solid var(--border);padding:2px 6px;margin-left:6px;color:var(--muted)">${item.pct}% du CA</span>`
      : '';
    const n1Row = n1
      ? (() => {
          if(n1.ca === 0) return `<div class="rank-n1-row">
           <div></div>
           <div class="rank-n1-label" style="color:var(--up-txt);font-style:normal;font-weight:500">↗ Nouvelle entrée · absent N-1</div>
           <div></div><div></div>
         </div>`;
          const evolCa2 = ((item.ca/n1.ca-1)*100).toFixed(1);
          const eDir2 = parseFloat(evolCa2)>=0?'up':'dn';
          const eStr2 = (parseFloat(evolCa2)>=0?'+':'')+evolCa2+'%';
          return `<div class="rank-n1-row">
           <div></div>
           <div class="rank-n1-label">N-1 · ${n1.n}${n1.pct!=null?` <span style="font-size:9px;color:var(--muted)">${n1.pct}%</span>`:''}</div>
           <div class="rank-n1-pcs">${n1.pcs} pcs</div>
           <div class="rank-n1-ca"><span style="font-size:11px;font-weight:300;color:var(--muted)">${fmtK(n1.ca)} €</span> <span class="rank-n1-evol ${eDir2}">${eStr2}</span></div>
         </div>`;
        })()
      : '';
    return `<div class="rank-row">
      <div class="rank-num${i===0?' n1':''}">${i+1}</div>
      <div>
        <div class="rank-name">${item.n}${weightBadge}</div>
        <div class="rank-bar-bg"><div class="rank-bar-fill" data-pct="${barPct}" style="width:0"></div></div>
      </div>
      <div class="rank-pcs">${item.pcs} pcs</div>
      <div class="rank-ca">${fmtK(item.ca)} €</div>
    </div>${n1Row}`;
  }).join('');

  return `<div class="rank-block">
    <div class="rank-hd">
      <span class="rank-hd-title">${title}</span>
      <span class="rank-hd-sub">CA TTC · pcs</span>
    </div>
    ${rows}
  </div>`;
}

function buildGC(id, gc){
  let html = `<div class="sec-label">Cartes cadeaux</div><div class="gc-grid">`;
  if(gc.vendues>0){
    html+=`<div class="gc-card">
      <div class="gc-label">Cartes vendues</div>
      <div class="gc-val">${gc.vendues}</div>
      <div class="gc-note">Montant émis : ${fmtK(gc.emis)} €</div>
    </div>`;
  } else {
    html+=`<div class="gc-card">
      <div class="gc-label">Cartes vendues</div>
      <div class="gc-val" style="color:var(--muted);font-size:18px">Aucune</div>
      <div class="gc-note">Pas d'émission ce mois</div>
    </div>`;
  }
  html+=`<div class="gc-card">
    <div class="gc-label">Montant vendu</div>
    <div class="gc-val">${fmtK(gc.depenses)} €</div>
    <div class="gc-note">${gc.note}</div>
  </div>`;
  html+=`</div>`;
  return html;
}

function buildHistory(id, hist, isWeb){
  const avail = Object.keys(hist);
  const LABELS = {ca:'CA TTC', cmd:'Commandes', idv:'IDV', pm:'Panier moy.', mg:'Marge HT'};

  const tabBtns = avail.map((k,i)=>
    `<button class="htab${i===0?' active':''}" onclick="showHist('${id}','${k}',this)">${LABELS[k]||k}</button>`
  ).join('');

  let contents='';
  avail.forEach((key,i)=>{
    const rows = hist[key];
    const isMg = key==='mg';
    const isCaOrCmd = (key==='ca'||key==='cmd');
    const hasCum = isCaOrCmd||isMg;

    let thead=`<thead><tr><th>Année</th><th>Avril</th><th>Mai</th><th>Juin</th><th>Juillet</th>`;
    if(hasCum) thead+=`<th>Cum. 4M</th>`;
    if(isMg) thead+=`<th>Taux marge</th>`;
    else thead+=`<th>Évol. vs N-1</th>`;
    thead+=`</tr></thead>`;

    let tbody='<tbody>';
    rows.forEach((r,ri)=>{
      const cls=ri===0?'y26':'';
      const isCurr = key==='ca'||isMg;

      const fmtV=(v)=>{
        if(v===null||v===undefined||v==='—') return `<td class="em">—</td>`;
        if(isCurr||isMg) return `<td>${typeof v==='number'?fmt(v)+' €':v}</td>`;
        if(key==='pm') return `<td>${v} €</td>`;
        return `<td>${typeof v==='number'?fmt(v):v}</td>`;
      };

      tbody+=`<tr class="${cls}"><td>${r.yr}</td>${fmtV(r.j)}${fmtV(r.f)}${fmtV(r.m)}${fmtV(r.a)}`;
      if(hasCum) tbody+=fmtV(r.cum);
      if(isMg) tbody+=`<td>${r.tx||'—'}</td>`;
      else {
        if(!r.evol||r.evol==='—') tbody+=`<td class="em">—</td>`;
        else tbody+=`<td class="${r.dir==='p'?'ep':'en'}">${r.evol}</td>`;
      }
      tbody+=`</tr>`;
    });
    tbody+='</tbody>';

    contents+=`<div class="hist-content${i===0?' active':''}" id="${id}-${key}">
      <table class="htable">${thead}${tbody}</table>
    </div>`;
  });

  return `<div class="sec-label">Historique mensuel</div>
  <div class="hist-block">
    <div class="hist-top">
      <span class="hist-title">Évolution des indicateurs</span>
      <div class="htabs">${tabBtns}</div>
    </div>
    ${contents}
  </div>`;
}

/* ════════════════════════════
   UTILS
════════════════════════════ */
function fmt(n){
  if(typeof n!=='number') return String(n);
  return Math.abs(n)<1 && n!==0
    ? n.toFixed(2)
    : n.toLocaleString('fr-FR',{maximumFractionDigits:0});
}
function fmtK(n){
  if(typeof n!=='number') return String(n);
  return n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function fmtEur(n){
  return fmtK(n)+' €';
}

// Auto-déverrouillage si chargé depuis le hub (#code=XXXX)
function __autoUnlock(){
  var h = window.location.hash || '';
  var m = h.match(/code=(\d{4})/);
  if(m && typeof CODES !== 'undefined' && CODES[m[1]]){
    pin = m[1];
    checkPin();
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', __autoUnlock);
} else {
  __autoUnlock();
}
